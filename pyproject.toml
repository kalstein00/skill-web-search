[project]
name = "web-search-relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "aiohttp>=3.12,<4",
    "beautifulsoup4>=4.13,<5",
    "playwright>=1.51,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "mypy>=1.15,<2",
    "types-beautifulsoup4",
    "ruff>=0.11,<1",
    "psutil>=7.2.2",
    "types-psutil>=7.2.2.20260906",
    "pyyaml>=6.0.3",
    "pyinstaller>=6.22.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["relay", "client.py", ".cline/skills/web-search/scripts/web_relay_client.py"]
check_untyped_defs = true
